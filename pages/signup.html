<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create an account | Lumen &amp; Kin</title>
    <link rel="icon" href="../assets/icons/mark.svg?v=20261125aperture" />
    <link rel="stylesheet" href="../assets/css/style.css?v=20261125forms" />
    <link rel="stylesheet" href="../assets/css/auth.css?v=20261124logo" />
    <script src="../assets/js/prefs.js?v=20261124"></script>
  </head>
  <body data-page="signup">
    <main class="auth-shell">
      <figure class="auth-photograph">
        <img
          src="../assets/images/targeted/auth-signup.jpg"
          alt="Photographic studio and professional camera work"
          loading="eager"
          decoding="async"
          srcset="
            ../assets/images/targeted/auth-signup-small.jpg  640w,
            ../assets/images/targeted/auth-signup.jpg       1600w,
            ../assets/images/targeted/auth-signup-large.jpg 2400w
          "
          sizes="(max-width:1024px) max(100vw, 700px), max(50vw, 700px)"
          width="1600"
          height="2400"
        />
      </figure>
      <section class="auth-card">
        <a class="brand" href="../index.html" aria-label="Lumen &amp; Kin home"
          ><svg aria-hidden="true" viewBox="0 0 48 48" fill="none">
            <use
              href="../assets/icons/brand-mark.svg?v=20261125aperture#studio-mark"
            ></use></svg
          ><span aria-hidden="true">LUMEN <i>&amp;</i> KIN</span></a
        >
        <h1>Create an account</h1>
        <p class="auth-intro">Make space for your photographs.</p>
        <form id="auth-form">
          <label for="name">Full name</label
          ><input
            id="name"
            name="name"
            autocomplete="name"
            required
            maxlength="80"
          /><label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          /><label for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
            /><button
              type="button"
              data-password="password"
              aria-controls="password"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <label for="confirm">Confirm password</label>
          <div class="password-field">
            <input
              id="confirm"
              name="confirm"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
            /><button
              type="button"
              data-password="confirm"
              aria-controls="confirm"
              aria-label="Show confirm password"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <button class="button auth-submit">Create Account</button>
        </form>
        <div class="auth-divider"><span>Or continue with</span></div>
        <div class="providers">
          <button type="button" data-provider="Google">
            <span aria-hidden="true" class="provider-g">G</span>Google</button
          ><button type="button" data-provider="Apple">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M16.4 3c-1.2.1-2.6.8-3.3 1.6-.7.8-1.3 2-1.1 3.1 1.3.1 2.6-.6 3.4-1.5.7-.8 1.2-2 1-3.2ZM19 15.4c-.5 1.2-.8 1.7-1.4 2.7-.9 1.3-2.1 3-3.5 3-1.3 0-1.6-.9-3.4-.9-1.7.1-2 .9-3.3.9-1.4 0-2.6-1.6-3.5-2.9C1.3 14.5 2 9 5.4 7.5c1.6-.7 3.1-.1 4.2.3.8.3 1 .3 1.8 0 1.1-.5 3-1.1 4.7-.2.9.5 1.5 1.1 2 1.8-3.1 1.6-2.6 5.1.9 6Z"
              /></svg
            >Apple
          </button>
        </div>
        <p role="status" aria-live="polite" id="auth-status"></p>
        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign In</a>
        </p>
      </section>
    </main>
    <script defer src="../assets/js/site-config.js?v=20261124sharp"></script>
    <script defer src="../assets/js/main.js?v=20261124"></script>
    <script defer src="../assets/js/auth.js?v=20261124"></script>
    <script defer src="../assets/js/form-controls.js?v=20261125forms"></script>
  </body>
</html>
