<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Welcome Back | Lumen &amp; Kin</title>
    <link rel="icon" href="../assets/icons/mark.svg" />
    <link rel="stylesheet" href="../assets/css/style.css?v=20261124" />
    <link rel="stylesheet" href="../assets/css/auth.css?v=20261124" />
    <script src="../assets/js/prefs.js?v=20261124"></script>
  </head>
  <body data-page="login">
    <main class="auth-shell">
      <section class="auth-card">
        <a class="brand" href="../index.html"
          ><svg
            aria-hidden="true"
            viewBox="0 0 25 25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M2 10V3h7m14 7V3h-7M2 16v7h7m14-7v7h-7" />
            <path d="m7 17 5-10 5 10Z" fill="currentColor" stroke="none" /></svg
          ><span>Lumen <i>&amp;</i> Kin</span></a
        >
        <h1>Welcome Back</h1>
        <p class="auth-intro">Your photographs, together in one place.</p>
        <form id="auth-form">
          <label for="email">Email</label
          ><input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          /><label for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="current-password"
            /><button
              type="button"
              data-password="password"
              aria-controls="password"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="auth-options">
            <label class="check"
              ><input type="checkbox" name="remember" />Remember Me</label
            ><button type="button" class="auth-link" data-reset>
              Forgot Password?
            </button>
          </div>
          <button class="button auth-submit">Sign In</button>
        </form>
        <div class="auth-divider"><span>Or continue with</span></div>
        <div class="providers">
          <button type="button" data-provider="Google">
            <span aria-hidden="true" class="provider-g">G</span>Google</button
          ><button type="button" data-provider="Apple">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M16.4 3c-1.2.1-2.6.8-3.3 1.6-.7.8-1.3 2-1.1 3.1 1.3.1 2.6-.6 3.4-1.5.7-.8 1.2-2 1-3.2ZM19 15.4c-.5 1.2-.8 1.7-1.4 2.7-.9 1.3-2.1 3-3.5 3-1.3 0-1.6-.9-3.4-.9-1.7.1-2 .9-3.3.9-1.4 0-2.6-1.6-3.5-2.9C1.3 14.5 2 9 5.4 7.5c1.6-.7 3.1-.1 4.2.3.8.3 1 .3 1.8 0 1.1-.5 3-1.1 4.7-.2.9.5 1.5 1.1 2 1.8-3.1 1.6-2.6 5.1.9 6Z"
              /></svg
            >Apple
          </button>
        </div>
        <p role="status" aria-live="polite" id="auth-status"></p>
        <p class="auth-switch">
          Don’t have an account? <a href="signup.html">Sign Up</a>
        </p>
      </section>
    </main>
    <script defer src="../assets/js/site-config.js?v=20261124"></script>
    <script defer src="../assets/js/main.js?v=20261124"></script>
    <script defer src="../assets/js/auth.js?v=20261124"></script>
  </body>
</html>
